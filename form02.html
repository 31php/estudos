<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
        }
        form{
            border: 2px solid black;
            padding: 10px;
            width: 400px;            
        }
    </style>
    
</head>
<body>
    <h1>Formulário</h1>

    <p>preencha o cadastro abaixo</p>

    <form action="formulario.php" method="post">
        <p>
            <label for="nome">Nome:</label>
            <input type="text" name="" id="nome" required minlength="10" placeholder="nome">
        </p>
        <p>
            <label for="sobrenome">Sobrenome: </label>
            <input type="text" name=" id="sobrenome" required minlength="8" placeholder="Sobrenome">
        </p>
        <p>
            <label for="idade">Idade:</label>
            <input type="number" name="" id="idade" required placeholder="idade">
        </p>        
        <p>
            <label for="data">Data de Nascimento:</label>
            <input type="date" name="" id="data" required>
        </p>
        <p>
            <label for="telefone">Telefone:</label>
            <input type="tel" name="telefone" id="telefone" minlength="11" placeholder="numero de telefone">
        </p>
        <p>
            <label for="email">E-mail:</label>
            <input type="email" name="" id="email" placeholder="email válido">
        </p>
        <p>
            <label for="end">Endereço:</label>
            <input type="text" name="" id="end" required placeholder="Endereço">
        </p>
        <p>
            <label for="numero">Número: </label>
            <input type="text" name="" id="numero">
        </p>
        <p>
            <label for="complemento">Complemento</label>
            <input type="text" name="" id="Complemento" autocomplete="">
        </p>

        <h2>Graduação</h2>

        <p>
            <label for="formacao">Formação:</label>
            <input type="text" name="" id="formacao" required>
        </p>
        <p>
            <label for="instituicao">Instituição:</label>
            <input type="text" name="" id="instituicao" required>
        </p>
        <p>
            <label for="anoDeFormacao">Ano de Formação:</label>
            <input type="date" name="" id="anoDeFormacao" required>
        </p>

        <h2>Experiências</h2>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
