<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        table{
            border: 2px solid black;
            border-collapse: collapse;
        }
        th, td{
            border: 2px solid black;
            padding: 10px;
        }

</head>

            </tr>

            </tr>
            <tr>

                <td>0.0</td>
            </tr>

                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4">Médias de Humanas</th>
                <td>0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
