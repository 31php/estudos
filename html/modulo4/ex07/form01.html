<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;            
        }        
    </style>
    
</head>
<body>
    <h1>Meu Primeiro formulário</h1>

   <form action="formulário.php" method="get">
    <fieldset>
        <legend>Dados pessoais</legend>
        <p>
            <label for="inome">Nome:</label> 
            <input type="text" name="" id="inome" autocomplete="name" required>
        </p>
        <p>
            <label for="isobrenome">Sobrenome:</label> 
            <input type="text" name="" id="isobrenome" autocomplete="">
      </p>
        <p>
            <label for="iidade">Idade: </label>
            <input type="number" name="" id="iidade">
        </p>
        <p>
            <label for="filiacao">Filiação: </label>
            <input type="text" name="" id="filiacao">
        </p>
        <p>
            <label for="sexo">Sexo: </label>
            <input type="radio" name="sexo" id="mas"><label for="mas">Masculino</label>
            <input type="radio" name="sexo" id="fem"><label for="fem">Feminino</label>
        </p>
    </fieldset>
    <fieldset>
        <legend>Documentação</legend>
        
    </fieldset>

        <input type="submit" value="enviar" onclick="enviar">
   </form>
</body>
</html>
