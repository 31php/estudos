<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Teste de formulários</h1>

    <form action="" method="get" autocomplete="on">
        <p>
            <label for="inome">Nome: </label>
            <input type="text" name="nome" id="inome" required placeholder="nome completo" maxlength="30" autocomplete="name">
        </p>
        <p>
            <label for="imedia">Média: </label>
            <input type="number" name="" id="" min="5" max="10" placeholder="de 0 á 10" step="0.1">
        </p>
        <p>
            <label for="imes">Periodo letivo: </label>
            <input type="month" name="mes" id="imes">
        </p>
        <p>
            <label for="idata">Dia da prova: </label>
            <input type="date" name="" id="idata">
        </p>
        <p>
            <label for="hora">Horário da prova: </label>
            <input type="time" name="" id="hora">
        </p>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>
</body>
</html>
