<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulário</h1>

    <form action="formulario.php" method="get">
        <fieldset> 
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome:</label>
                <input type="text" name="" id="inome" required minlength="4" maxlength="20" >
            </p>
            <p>
                <label for="iemal">E-mail:</label>
                <input type="email" name="" id="iemal" autocomplete="email" required>
            </p>
            <p>
                <label for="itel">Telefone:</label>
                <input type="tel" name="" id="itel" autocomplete="tel" required placeholder="(xx)xxxx-xxxx">
            </p>
    </fieldset> 
       
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
