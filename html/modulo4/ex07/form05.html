<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Testando formulários</h1>
    <form action="" method="get" autocomplete="on">
        <fieldset>
            <legend>Cor</legend>
        
                <label for="neg">Negro</label>
                <input type="radio" name="cor" id="neg">
        
                <label for="par">Pardo</label>
                <input type="radio" name="cor" id="par">
                <label for="bra">Branco</label>
                <input type="radio" name="cor" id="bra">
                <label for="ind">indigena</label>
                <input type="radio" name="cor" id="ind">
        
        </fieldset>
        <fieldset>
            <legend>Gênero</legend>
                <label for="mas">Masculino</label>
                <input type="radio" name="sexo" id="mas">
                <label for="fem">Feminino</label>
                <input type="radio" name="sexo" id="fem">
                <label for="out">Outros</label>
                <input type="radio" name="sexo" id="out">
        
        </fieldset>
        <fieldset>
            <legend>Esportes favoritos</legend>
                <input type="checkbox" name="fut" id="ifut">
                <label for="ifut">Futebol</label>
        
                <input type="checkbox" name="bas" id="ibas">
                <label for="ibas">Basquetebol</label>
        
                <input type="checkbox" name="vol" id="ivol">
                <label for="ivol">vôlei</label>
                <input type="checkbox" name="nat" id="inat">
                <label for="inat">Natação</label>
        
                <input type="checkbox" name="ten" id="iten">
                <label for="iten">Tênis</label>
        
        </fieldset>
         <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
    
</body>
</html>
