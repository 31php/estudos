<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Exemplo de formulário</h1>

    <form action="formulario.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="mas">
            <label for="mas">Masculino</label>

            <input type="radio" name="sexo" id="fem" checked>
            <label for="fem">Feminino</label>
        </fieldset>

        <fieldset>
            <legend>Esportes favoritos</legend>
            <input type="checkbox" name="" id="fut">
            <label for="fut">futebol</label><br>

            <input type="checkbox" name="" id="bas">
            <label for="bas">Basquete</label><br>

            <input type="checkbox" name="" id="vol">
            <label for="vol">Vôlei</label><br>

            <input type="checkbox" name="" id="ten">
            <label for="ten">Tênis</label><br>

            <input type="checkbox" name="" id="han">
            <label for="han">Handball</label><br>

            <input type="checkbox" name="" id="nat">
            <label for="nat">Natação</label><br>

            <input type="checkbox" name="" id="cor">
            <label for="cor">Corrida</label><br>

            <input type="checkbox" name="" id="cam">
            <label for="cam">Caminhada</label><br>

            <input type="checkbox" name="" id="cic">
            <label for="cic">Ciclismo</label><br>

            <input type="checkbox" name="" id="mon">
            <label for="mon">Montanhismo</label><br>


        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
