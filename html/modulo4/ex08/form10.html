<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>

    <form action="" method="get" autocomplete="on">

        <p>
            <label for="ianoAtu">Ano atual</label>
            <input type="number" name="anoAtual" id="ianoAtu" oninput="idade.innerHTML = Number(ianoAtu.value) - Number(iano.value)">
        </p>
        <p>
            <label for="iano">Em que ano você nasceu: </label>
            <input type="number" name="ano" id="iano" oninput="idade.innerHTML = Number(ianoAtu.value) - Number(iano.value)">
        </p>
        <p>
            <label for="">Sua idade é:</label>
            <output id="idade">0</output>
        </p>
        
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
